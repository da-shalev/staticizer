name: platforms

on:
  workflow_dispatch:

jobs:
  cross-crate:
    name: Cross-crate tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [nightly, stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustc-dev, clippy

      # The one setting USAGE.md documents for stable, applied to the whole build.
      - name: Allow the macro crate's unstable APIs on stable
        if: matrix.toolchain == 'stable'
        working-directory: tests/cross-crate
        run: |
          mkdir -p .cargo
          printf '[env]\nRUSTC_BOOTSTRAP = "staticizer_macros"\n' > .cargo/config.toml

      - name: Run the cross-crate tests in release with LTO
        working-directory: tests/cross-crate
        env:
          CARGO_PROFILE_RELEASE_LTO: true
        run: cargo test --locked --release

      - name: Run Clippy on the cross-crate tests
        working-directory: tests/cross-crate
        run: cargo clippy --locked --all-targets
