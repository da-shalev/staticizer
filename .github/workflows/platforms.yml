name: platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cross-crate:
    name: Cross-crate tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: rustc-dev, llvm-tools

      - name: Expose the compiler libraries to the wrapper
        run: |
          sysroot="$(rustc --print sysroot)"
          case "$RUNNER_OS" in
            Linux) echo "LD_LIBRARY_PATH=$sysroot/lib" >> "$GITHUB_ENV" ;;
            macOS) echo "DYLD_FALLBACK_LIBRARY_PATH=$sysroot/lib" >> "$GITHUB_ENV" ;;
            Windows) echo "$sysroot/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Install the wrapper
        run: cargo install --path . --locked

      - name: Run the cross-crate tests
        working-directory: tests/cross-crate
        run: cargo test --locked
