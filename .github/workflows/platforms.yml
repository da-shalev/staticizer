name: platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cross-crate:
    name: Cross-crate tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The pinned nightly from flake.nix and whatever nightly is current, so the wrapper is
        # tested against a toolchain it was not built with.
        toolchain: [nightly-2026-09-21, nightly]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustc-dev, llvm-tools

      - name: Install the wrapper
        run: cargo install --path . --locked

      - name: Run the cross-crate tests
        working-directory: tests/cross-crate
        run: cargo test --locked
