name: platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cross-crate:
    name: Cross-crate tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustc-dev, clippy

      - name: Run the cross-crate tests
        working-directory: tests/cross-crate
        run: cargo test --locked

      - name: Run Clippy on the cross-crate tests
        working-directory: tests/cross-crate
        run: cargo clippy --locked --all-targets
